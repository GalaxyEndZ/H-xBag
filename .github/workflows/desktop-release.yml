name: Publicar HäxBag Desktop (Windows)

# Este workflow fica no REPOSITÓRIO DO CÓDIGO-FONTE.
# As releases são enviadas para GalaxyEndZ/H-xBagReleases (repositório público separado).
on:
  push:
    tags:
      - 'v*'

# O GITHUB_TOKEN só recebe acesso de leitura ao código-fonte.
# Para publicar no repositório separado, use HAXBAG_RELEASE_TOKEN, escopo restrito.
permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      HAXBAG_RELEASE_REPOSITORY: GalaxyEndZ/H-xBagReleases
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Conferir versão da release
        shell: pwsh
        run: node desktop/verify-release-version.cjs
        env:
          HAXBAG_TAG: ${{ github.ref_name }}

      - name: Verificar configuração antes da compilação
        shell: pwsh
        env:
          RELEASE_TOKEN: ${{ secrets.HAXBAG_RELEASE_TOKEN }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TOKEN)) { throw 'Falta o secret HAXBAG_RELEASE_TOKEN no repositorio do CODIGO (token com Contents: Read and write em GalaxyEndZ/H-xBagReleases).' }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_URL)) { throw 'Falta o secret VITE_SUPABASE_URL no repositorio do CODIGO.' }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_KEY)) { throw 'Falta o secret VITE_SUPABASE_PUBLISHABLE_KEY no repositorio do CODIGO.' }
          if ($env:SUPABASE_URL -notmatch '^https://') { throw 'VITE_SUPABASE_URL deve ser HTTPS.' }
          Write-Host 'Destino da release: GalaxyEndZ/H-xBagReleases'

      - name: Instalar dependências
        # O lockfile legado da V297 não listava o Electron: npm install recompõe
        # a árvore até que o lockfile atualizado seja gerado e commitado.
        run: npm install --no-audit --no-fund

      - name: Confirmar dependências do desktop
        run: npm ls electron electron-updater electron-builder --depth=0

      - name: Testar o fluxo de atualizacoes
        run: npm run test:updater

      - name: Compilar interface React
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_HAXBAG_PUBLIC_URL: ${{ vars.VITE_HAXBAG_PUBLIC_URL }}
          VITE_HAXBAG_VOICE_ICE_URL: ${{ vars.VITE_HAXBAG_VOICE_ICE_URL }}

      - name: Gerar e publicar instalador NSIS no repositorio de releases
        shell: pwsh
        run: npx electron-builder --config desktop/electron-builder.config.cjs --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.HAXBAG_RELEASE_TOKEN }}

      - name: Conferir instalador e metadados
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $manifest = 'dist-desktop/latest.yml'
          $setup = "dist-desktop/HaxBag-Setup-$version-x64.exe"
          if (!(Test-Path $manifest)) { throw 'latest.yml ausente; sem ele o auto-updater nao funciona.' }
          if (!(Test-Path $setup)) { throw "Instalador NSIS ausente: $setup" }
          $content = Get-Content $manifest -Raw
          if ($content -notmatch ('(?m)^version:\s*' + [regex]::Escape($version) + '\s*$')) { throw 'latest.yml nao corresponde a versao do instalador.' }
          if ($content -notmatch [regex]::Escape("HaxBag-Setup-$version-x64.exe")) { throw 'latest.yml nao referencia o Setup NSIS.' }
          Write-Host "Manifesto e instalador verificados: v$version"

      # Um build pode terminar com latest.yml local, mas a publicação
      # automática do electron-builder deixar o asset ausente na release.
      # Por isso enviamos explicitamente o manifesto e o Setup NSIS,
      # sempre da MESMA compilação, antes de tornar a release pública.
      - name: Garantir upload do latest.yml e Setup na release de destino
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.HAXBAG_RELEASE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $setup = "dist-desktop/HaxBag-Setup-$version-x64.exe"
          $manifest = 'dist-desktop/latest.yml'
          $files = @($setup, $manifest)
          $blockmap = "$setup.blockmap"
          if (Test-Path $blockmap) { $files += $blockmap }

          # A publicação do electron-builder normalmente cria um draft.
          # Se não criou, garantimos que a release exista no repositório novo.
          gh release view $tag --repo $env:HAXBAG_RELEASE_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:HAXBAG_RELEASE_REPOSITORY --draft --title "HäxBag v$version" --notes "Atualização do HäxBag Desktop v$version."
            if ($LASTEXITCODE -ne 0) { throw 'Não foi possível criar a release de destino.' }
          }

          Write-Host "Enviando para $env:HAXBAG_RELEASE_REPOSITORY / $tag"
          gh release upload $tag @files --clobber --repo $env:HAXBAG_RELEASE_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Falha no upload do latest.yml e/ou do instalador NSIS.' }

          # Confere os assets na API ANTES de publicar a release.
          # Pequenos atrasos na indexação do GitHub são tolerados.
          $found = $false
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            $data = gh release view $tag --repo $env:HAXBAG_RELEASE_REPOSITORY --json assets | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Não foi possível consultar os assets publicados.' }
            $names = @($data.assets | ForEach-Object { $_.name })
            if (($names -contains 'latest.yml') -and ($names -contains "HaxBag-Setup-$version-x64.exe")) {
              $found = $true
              break
            }
            Start-Sleep -Seconds 3
          }
          if (-not $found) { throw "A release $tag continua sem latest.yml e/ou Setup após o upload." }
          Write-Host "Ambos os arquivos foram confirmados no GitHub antes de tornar $tag publica."

      - name: Tornar release publica apos gerar os artefatos
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.HAXBAG_RELEASE_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release edit $tag --draft=false --repo $env:HAXBAG_RELEASE_REPOSITORY

      - name: Conferir release PUBLICA com os arquivos do auto-updater
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.HAXBAG_RELEASE_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $data = gh release view $tag --repo $env:HAXBAG_RELEASE_REPOSITORY --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if (!$data -or $data.tagName -ne $tag -or $data.isDraft -or $data.isPrerelease) { throw 'A release ainda nao esta publica/estavel.' }
          $names = @($data.assets | ForEach-Object { $_.name })
          if ($names -notcontains 'latest.yml') { throw 'latest.yml nao foi publicado.' }
          if ($names -notcontains "HaxBag-Setup-$version-x64.exe") { throw 'O instalador NSIS nao foi publicado.' }
          Write-Host "Release publica verificada: $tag / latest.yml / Setup NSIS"
