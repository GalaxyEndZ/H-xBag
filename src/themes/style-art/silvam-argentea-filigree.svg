  <use href="#leaf" transform="translate(1351 530) rotate(120) scale(.87)"/><use href="#leaf" transform="translate(1423 487) rotate(118) scale(.8)"/>
  <use href="#leaf" transform="translate(1366 423) rotate(20) scale(.8)"/><use href="#leaf" transform="translate(1416 357) rotate(15) scale(.67)"/>
