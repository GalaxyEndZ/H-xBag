      <stop stop-color="#7c9b9e" stop-opacity=".07"/>
      <stop offset=".56" stop-color="#c7e1dc" stop-opacity=".38"/>
      <stop offset="1" stop-color="#e8f5ed" stop-opacity=".64"/>
